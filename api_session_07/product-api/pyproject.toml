[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Flask",
  "Flask-Migrate",
  "Flask-SQLAlchemy",
  "gunicorn",
  "marshmallow",
  "psycopg[binary]",
  "SQLAlchemy",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
