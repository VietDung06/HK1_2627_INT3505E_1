# OpenAPI 3.0 Spec
openapi: 3.0.3
info:
  title: Product API
  version: 1.0.0

paths:
  /products:
    get:
      # operationId có dạng: module_path.function_name
      operationId: products_design_first.list_products
      responses:
        '200':
          description: OK
    post:
      operationId: products_design_first.create_product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: number
      responses:
        '201':
          description: Created
        '422':
          description: Validation

  /products/{id}:
    get:
      operationId: products_design_first.get_product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '404':
          description: Not Found